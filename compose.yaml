name: agente-estoque-sctec

services:
  n8n:
    image: n8nio/n8n:2.49.7
    # No Linux, compartilha a rede do computador para alcançar o agente local.
    network_mode: host
    environment:
      # Continua aceitando acesso somente neste computador.
      N8N_LISTEN_ADDRESS: 127.0.0.1
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
